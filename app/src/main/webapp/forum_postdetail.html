<nav class="nv-nav container" aria-label="主選單">

</a>
<button class="nv-menu-toggle" id="nav-toggle" type="button" aria-expanded="false" aria-controls="site-links">選單 <span aria-hidden="true">☰</span>
</button>
<div class="nv-links" id="site-links">
<a href="activities.html">活動專區</a>
<a href="checkout_cart.html">購物車</a>
<a href="forum_home.html">社群首頁</a>
<a href="forum_dopost.html">新增文章</a>
<a href="sign-in.html" id="login-link">會員登入</a>
<a href="member.html" id="member-link" hidden>會員資料</a>
<span id="session-name">
</span>
<button id="logout-button" type="button" hidden>登出</button>
</div>
</nav>
</header>

<div id="page-status" class="nv-status container" hidden role="status" aria-live="polite">
</div>
<main id="main-content" class="container nv-social-detail">
<a class="nv-back" href="forum_home.html">← 返回社群</a>
<article class="nv-article nv-story-article">
<div class="nv-article-head">
<span id="cate" class="nv-tag">
</span>
<h1 id="postHeader">載入文章中…</h1>
<p class="nv-story-byline">
<span id="post-author-avatar" aria-hidden="true">
</span>
<span id="name">
</span> · <time id="day2">
</time>
<span id="edited-date">
</span>
</p>
</div>
<div id="picturearea" hidden>
<div id="myCarousel" class="carousel slide" data-bs-interval="false">
<div class="carousel-inner">
</div>
<a class="carousel-control-prev" href="#myCarousel" role="button" data-bs-slide="prev" aria-label="上一張圖片">
<span class="carousel-control-prev-icon" aria-hidden="true">
</span>
</a>
<a class="carousel-control-next" href="#myCarousel" role="button" data-bs-slide="next" aria-label="下一張圖片">
<span class="carousel-control-next-icon" aria-hidden="true">
</span>
</a>
</div>
<p id="image-caption" class="nv-muted">
</p>
</div>
<p id="postContent" class="nv-post-content">
</p>
<div class="nv-article-actions">
<div>
<button id="likeButton" type="button" class="nv-reaction">讚 <span id="likeCount">0</span>
</button>
<button id="dislikeButton" type="button" class="nv-reaction">倒讚 <span id="dislikeCount">0</span>
</button>
</div>
<div id="author-actions" hidden>
<a id="modifyButton" class="nv-button nv-button-outline">修改文章</a>
<button id="deleteButton" type="button" class="nv-button nv-button-outline">刪除文章</button>
</div>
</div>
</article>
<section class="nv-comments">
<span class="nv-eyebrow">KEEP THE CONVERSATION GOING</span>
<h2>留言交流 <span id="messageCount">0</span>
</h2>
<p id="login-prompt" hidden>登入後就可以留言囉。<a id="comment-login" href="sign-in.html">前往登入 →</a>
</p>
<form id="comment-form" hidden>
<label for="mesContent">新增留言</label>
<textarea class="form-control" id="mesContent" name="mesContent" maxlength="1000" required rows="3" placeholder="分享你的想法…">
</textarea>
<button id="postCommentButton" type="submit" class="nv-button">送出留言</button>
</form>
<div id="commentsContainer">
</div>
</section>
</main>
<footer class="nv-footer">
<div class="container">
<a class="nv-logo" href="forum_home.html">NewView</a>
<p>在藝文裡相遇，在社群裡交流。</p>

</div>
</footer>
</body>
</html>
