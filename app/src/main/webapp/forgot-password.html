<section class="nv-form-card">
<h1>忘記密碼</h1>
<p>展示模式不寄送郵件，驗證碼會直接顯示於此頁。請使用展示帳號。</p>
<form id="request-reset-form">
<div class="form-group">
<label for="account">帳號</label>
<input class="form-control" id="account" name="account" required maxlength="40" autocomplete="username">
</div>
<div class="form-group">
<label for="email">註冊信箱</label>
<input class="form-control" id="email" name="email" type="email" required maxlength="254">
</div>
<button class="nv-button" type="submit">取得驗證碼</button>
</form>
<form id="reset-password-form" hidden>
<p id="reset-code" role="status">
</p>
<div class="form-group">
<label for="verificationCode">驗證碼</label>
<input class="form-control" id="verificationCode" name="verificationCode" required pattern="[0-9]{6}" autocomplete="one-time-code">
</div>
<div class="form-group">
<label for="newPassword">新密碼（12–128 字元）</label>
<input class="form-control" id="newPassword" name="newPassword" type="password" required maxlength="128" minlength="12" autocomplete="new-password">
</div>
<div class="form-group">
<label for="confirmNewPassword">確認新密碼</label>
<input class="form-control" id="confirmNewPassword" name="confirmNewPassword" type="password" required maxlength="128" minlength="12" autocomplete="new-password">
</div>
<button class="nv-button" type="submit">驗證並重設密碼</button>
<button type="button" id="reset-restart">重新取得驗證碼</button>
</form>
<p>
<a href="sign-in.html">返回登入</a>
</p>
