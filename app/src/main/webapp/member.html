</div>

<p class="nv-profile-account">帳號：<strong id="member-account">
</strong>
</p>
<form id="profile-form">
<div class="form-group">
<label for="name">姓名</label>
<input class="form-control" id="name" name="name" type="text" required maxlength="100" >
</div>
<div class="form-group">
<label for="nickname">暱稱</label>
<input class="form-control" id="nickname" name="nickname" type="text" required maxlength="100" >
</div>
<div class="form-group">
<label for="birthdate">生日</label>
<input class="form-control" id="birthdate" name="birthdate" type="date" required maxlength="10" >
</div>
<div class="form-group">
<label for="cellphone">手機（選填）</label>
<input class="form-control" id="cellphone" name="cellphone" type="tel" maxlength="10" pattern="09[0-9]{8}">
</div>
<div class="form-group">
<label for="email">電子郵件</label>
<input class="form-control" id="email" name="email" type="email" required maxlength="254" >
</div>
<button class="nv-button" type="submit">儲存會員資料</button>
</form>
<p>
<a href="change-password.html">修改密碼 →</a>
