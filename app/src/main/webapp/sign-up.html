<aside class="nv-auth-story">
<span class="nv-eyebrow">YOUR STORY STARTS HERE</span>
<h2>從一場演出，<br>開始你的藝文日常。</h2>
<p>把期待的活動，和喜歡的片刻，一起收好。</p>
<div class="nv-auth-art" aria-hidden="true">
<span>N.</span>
</div>
<small>NEW VIEW, NEW CONNECTIONS</small>
</aside>
<div class="nv-auth-form-area">
<section class="nv-form-card">
<h1>會員註冊</h1>
<p>歡迎加入 NewView。這是作品展示網站，請勿輸入真實個人資料。</p>
<form id="register-form">
<div class="form-group">
<label for="account">帳號</label>
<input class="form-control" id="account" name="account" required pattern="[A-Za-z][A-Za-z0-9_]{2,39}" autocomplete="username">
</div>
<div class="form-group">
<label for="name">姓名</label>
<input class="form-control" id="name" name="name" type="text" required maxlength="100" >
</div>
<div class="form-group">
<label for="nickname">暱稱</label>
<input class="form-control" id="nickname" name="nickname" type="text" required maxlength="100" >
</div>
<div class="form-group">
<label for="birthdate">生日</label>
<input class="form-control" id="birthdate" name="birthdate" type="date" required maxlength="10" >
</div>
<div class="form-group">
<label for="cellphone">手機（選填）</label>
<input class="form-control" id="cellphone" name="cellphone" type="tel" maxlength="10" pattern="09[0-9]{8}">
</div>
<div class="form-group">
<label for="email">電子郵件</label>
<input class="form-control" id="email" name="email" type="email" required maxlength="254" >
</div>
<div class="form-group">
<label for="password">密碼（12–128 字元）</label>
<input class="form-control" id="password" name="password" type="password" required minlength="12" maxlength="128" autocomplete="new-password">
</div>
<div class="form-group">
<label for="confirmPassword">確認密碼</label>
<input class="form-control" id="confirmPassword" name="confirmPassword" type="password" required minlength="12" maxlength="128" autocomplete="new-password">
</div>
<button class="nv-button" type="submit">取得本機驗證碼</button>
</form>
<form id="verify-form" hidden>
<p id="local-code" role="status">
</p>
<label for="code">輸入驗證碼</label>
<input class="form-control" id="code" name="code" required pattern="[0-9]{6}">
<button class="nv-button" type="submit">完成註冊</button>
<button type="button" id="restart-register">重新填寫</button>
</form>
<a href="sign-in.html">已有帳號？前往登入</a>
</section>
</div>
